name: LumaTax
description: 'LumaTax is a US and Canadian sales tax automation platform that helps businesses
  automate sales tax filings, manage nexus exposure, and streamline remittance across multiple
  state and federal jurisdictions. The product imports transaction data from sources such as
  Amazon, Stripe, Shopify, and Excel, validates that data and assigns correct tax jurisdictions,
  generates categorized return summaries, files returns automatically, and stores past filings
  for audit preparation. Originally an independent Seattle fintech backed by Cowboy Ventures,
  LumaTax was acquired and is now offered as a product line under Taxually alongside CrossTax,
  EcoTax, and OneTax. As of enrichment it exposes no public developer portal, API reference, SDK,
  or machine-readable API surface.'
